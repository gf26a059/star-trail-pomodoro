<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An ASCII star-trail time-lapse Pomodoro timer. Each focus session is one night; each break is one day.">
<title>Star Trail Pomodoro</title>
<style>
  /* Layout: one full-bleed ASCII canvas (sky, star trails, horizon, ground). The timer sits on the ground inside an ASCII-framed box;
     camera HUD top-left, settings top-right. Single hue and saturation; only lightness changes. Light theme only, by design. */
  :root {
    --hue: 222;
    --sat: 10%;
    --bg: hsl(var(--hue) var(--sat) 98%);
    --ink: hsl(var(--hue) var(--sat) 12%);
    --muted: hsl(var(--hue) var(--sat) 44%);
    --faint: hsl(var(--hue) var(--sat) 72%);
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--mono); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 1px dashed var(--ink); outline-offset: 3px; }

  .hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    font-size: 11px; letter-spacing: 0.06em; color: var(--muted); white-space: pre-wrap; max-width: calc(100vw - 150px); font-variant-numeric: tabular-nums; }
  .hud b { color: var(--ink); font-weight: 600; }
  .gear { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 11px; letter-spacing: 0.06em; color: var(--muted); padding: 4px 2px; }
  .gear:hover { color: var(--ink); }

  .panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(5vh + env(safe-area-inset-bottom, 0px));
    width: min(440px, calc(100vw - 48px)); padding: 18px 16px 14px; text-align: center; }
  .modes { display: flex; justify-content: center; gap: 2px 10px; flex-wrap: wrap; font-size: 12px; }
  .modes button { color: var(--muted); padding: 3px 2px; }
  .modes button::before { content: "\00a0"; } .modes button::after { content: "\00a0"; }
  .modes button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
  .modes button[aria-pressed="true"]::before { content: "["; } .modes button[aria-pressed="true"]::after { content: "]"; }
  .time { font-size: clamp(60px, 17vw, 108px); font-weight: 300; letter-spacing: -0.05em; line-height: 1;
    margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
  .cycle { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .controls { display: flex; justify-content: center; gap: 4px 14px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; }
  .controls button { padding: 4px 0; color: var(--muted); }
  .controls button:hover { color: var(--ink); }
  .controls button::before { content: "[ "; } .controls button::after { content: " ]"; }
  .controls .primary { color: var(--ink); font-weight: 600; }
  .status { font-size: 11px; color: var(--muted); margin-top: 10px; min-height: 1.3em; }

  .settings { position: fixed; top: calc(40px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(270px, calc(100vw - 48px)); padding: 16px 14px; font-size: 12px; }
  .settings h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; margin: 0 0 8px; }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 0; color: var(--muted); }
  .settings input[type="number"] { width: 52px; font: inherit; color: var(--ink); background: transparent; border: 0;
    border-bottom: 1px dashed var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
  .settings input[type="checkbox"] { accent-color: var(--ink); }
  .settings p { margin: 10px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.5; }
</style>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="hud" id="hud" data-ascii="clear">CAM-01</div>
<button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="settings" data-ascii="clear">[ settings ]</button>

<main class="panel" id="panel" data-ascii="frame">
  <div class="modes" role="group" aria-label="Mode">
    <button type="button" data-mode="focus" aria-pressed="true">focus</button>
    <button type="button" data-mode="short" aria-pressed="false">short break</button>
    <button type="button" data-mode="long" aria-pressed="false">long break</button>
  </div>
  <div class="time" id="time" role="timer" aria-label="Time remaining">25:00</div>
  <div class="cycle" id="cycle">[ ][ ][ ][ ]  0 today</div>
  <div class="controls">
    <button type="button" class="primary" id="toggle">start</button>
    <button type="button" id="reset">reset</button>
    <button type="button" id="skip">skip</button>
  </div>
  <div class="status" id="status" aria-live="polite">space: start/pause · r: reset · n: skip</div>
</main>

<section class="settings" id="settings" data-ascii="frame" hidden aria-label="Settings">
  <h2>SETTINGS</h2>
  <label for="s-focus">focus (min) <input id="s-focus" type="number" min="1" max="120" step="1"></label>
  <label for="s-short">short break (min) <input id="s-short" type="number" min="1" max="60" step="1"></label>
  <label for="s-long">long break (min) <input id="s-long" type="number" min="1" max="90" step="1"></label>
  <label for="s-every">long break every <input id="s-every" type="number" min="2" max="8" step="1"></label>
  <label for="s-autobreak">auto-start breaks <input id="s-autobreak" type="checkbox"></label>
  <label for="s-autofocus">auto-start focus <input id="s-autofocus" type="checkbox"></label>
  <label for="s-sound">chime <input id="s-sound" type="checkbox"></label>
  <p>Each focus session is one night: dusk 19:00 to dawn 05:00. Each break is one day: sunrise 06:00 to sunset 18:00. The camera shutter stays open while you focus, so star trails grow with your work.</p>
</section>

<script>
(() => {
  // ============================================================
  //  Timer
  // ============================================================
  const DEF = { focus: 25, short: 5, long: 15, every: 4, autoBreak: true, autoFocus: false, sound: true };
  const S = { ...DEF };
  try { Object.assign(S, JSON.parse(localStorage.getItem('stp-settings') || '{}')); } catch (e) {}
  const saveS = () => { try { localStorage.setItem('stp-settings', JSON.stringify(S)); } catch (e) {} };
  const todayKey = new Date().toISOString().slice(0, 10);
  let today = 0;
  try { const d = JSON.parse(localStorage.getItem('stp-today') || '{}'); if (d.k === todayKey) today = d.n; } catch (e) {}
  const saveToday = () => { try { localStorage.setItem('stp-today', JSON.stringify({ k: todayKey, n: today })); } catch (e) {} };

  // 1 focus = one night (19:00→05:00, 10 h). 1 break = one day (06:00→18:00, 12 h).
  const SKY = { focus: { start: 19, span: 10 }, short: { start: 30, span: 12 }, long: { start: 30, span: 12 } };
  const LABEL = { focus: 'focus', short: 'short break', long: 'long break' };
  let mode = 'focus', running = false, endAt = 0, remaining = S.focus * 60000, inCycle = 0, simDay = 0;
  const dur = m => S[m] * 60000;
  const progress = () => Math.min(1, Math.max(0, 1 - remaining / dur(mode)));

  const $ = id => document.getElementById(id);
  const timeEl = $('time'), statusEl = $('status'), cycleEl = $('cycle'), toggleEl = $('toggle'), hudEl = $('hud');

  let audio = null;
  function ensureAudio() {
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  }
  function chime() {
    if (!S.sound || !audio) return;
    const now = audio.currentTime;
    [659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i * 0.18);
      g.gain.linearRampToValueAtTime(0.18, now + i * 0.18 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 1.2);
      o.connect(g).connect(audio.destination);
      o.start(now + i * 0.18); o.stop(now + i * 0.18 + 1.3);
    });
  }

  function setMode(m, autostart) {
    if (mode !== 'focus' && m === 'focus') { simDay++; clearTrails(); }
    mode = m; running = false; remaining = dur(m);
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    if (autostart) start();
    render();
  }
  function start() {
    ensureAudio();
    if (remaining <= 0) remaining = dur(mode);
    endAt = Date.now() + remaining; running = true; render();
  }
  function pause() { tick(); running = false; render(); }
  function reset() { running = false; remaining = dur(mode); if (mode === 'focus') clearTrails(); say('Reset.'); render(); }
  function next(counted) {
    running = false;
    if (mode === 'focus') {
      if (counted) { inCycle++; today++; saveToday(); }
      const longNext = counted && inCycle >= S.every;
      say(counted ? (longNext ? 'Night complete. Long break.' : 'Night complete. Short break.') : 'Skipped to break.');
      setMode(longNext ? 'long' : 'short', counted && S.autoBreak);
    } else {
      if (mode === 'long') inCycle = 0;
      say(counted ? 'Break over. Back to the night sky.' : 'Skipped to focus.');
      setMode('focus', counted && S.autoFocus);
    }
  }
  function tick() {
    if (!running) return;
    remaining = Math.max(0, endAt - Date.now());
    if (remaining <= 0) { chime(); next(true); }
  }
  let sayTimer = 0;
  function say(msg) {
    statusEl.textContent = msg;
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { statusEl.textContent = 'space: start/pause · r: reset · n: skip'; }, 4000);
  }
  const fmt = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  let lastTxt = '';
  function render() {
    const txt = fmt(remaining);
    if (txt !== lastTxt) { timeEl.textContent = txt; document.title = txt + ' · ' + LABEL[mode]; lastTxt = txt; }
    toggleEl.textContent = running ? 'pause' : (remaining < dur(mode) ? 'resume' : 'start');
    let boxes = '';
    for (let i = 0; i < S.every; i++) boxes += i < inCycle ? '[#]' : '[ ]';
    cycleEl.textContent = boxes + '  ' + today + ' today';
  }

  toggleEl.onclick = () => running ? pause() : start();
  $('reset').onclick = reset;
  $('skip').onclick = () => next(false);
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode, false); });
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input')) return;
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'n' || e.key === 'N') next(false);
  });

  // settings
  const gear = $('gear'), settings = $('settings');
  gear.onclick = () => { settings.hidden = !settings.hidden; gear.setAttribute('aria-expanded', String(!settings.hidden)); };
  const bindNum = (id, key, lo, hi) => {
    const el = $(id); el.value = S[key];
    el.addEventListener('change', () => {
      const v = Math.round(Math.min(hi, Math.max(lo, Number(el.value) || DEF[key])));
      el.value = v;
      const wasFull = !running && remaining === dur(mode);
      S[key] = v; saveS();
      if (wasFull) remaining = dur(mode);
      else remaining = Math.min(remaining, dur(mode));
      render();
    });
  };
  bindNum('s-focus', 'focus', 1, 120); bindNum('s-short', 'short', 1, 60); bindNum('s-long', 'long', 1, 90); bindNum('s-every', 'every', 2, 8);
  const bindBool = (id, key) => { const el = $(id); el.checked = S[key]; el.addEventListener('change', () => { S[key] = el.checked; saveS(); }); };
  bindBool('s-autobreak', 'autoBreak'); bindBool('s-autofocus', 'autoFocus'); bindBool('s-sound', 'sound');

  // ============================================================
  //  Sky clock
  // ============================================================
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const simHours = () => simDay * 24 + SKY[mode].start + SKY[mode].span * progress();
  function light() {                  // night: 0..1, twilight: 0..1
    const p = progress();
    if (mode === 'focus') return { night: smooth(0.04, 0.14, p) * (1 - smooth(0.88, 0.98, p)), twi: (1 - smooth(0, 0.14, p)) + smooth(0.86, 1, p) };
    return { night: 0, twi: (1 - smooth(0, 0.1, p)) + smooth(0.9, 1, p) };
  }

  // ============================================================
  //  ASCII renderer
  // ============================================================
  const cv = $('c'), ctx = cv.getContext('2d');
  const rootCS = getComputedStyle(document.documentElement);
  const HUE = parseFloat(rootCS.getPropertyValue('--hue')) || 222, SAT = parseFloat(rootCS.getPropertyValue('--sat')) || 10;
  const L_MIN = 12, L_MAX = 88, LEVELS = 32;
  const GLYPHS = " .,:;'`-~=+*^oO0()|/\\_%#&$@";
  const GI = {}; [...GLYPHS].forEach((g, i) => GI[g] = i);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  let W = 0, H = 0, CELL = 9, cols = 1, rows = 1, dpr = 1;
  let gG, gL, gP, trI, trG, skyEnd, nearRow, farRow, mask;
  let horizonY = 0, pole = { x: 0, y: 0 };
  let stars = [], trees = [], clouds = [];

  const atlas = document.createElement('canvas'), actx = atlas.getContext('2d');
  let atlasKey = '';
  function buildAtlas() {
    const gs = CELL * dpr;
    atlas.width = gs * GLYPHS.length; atlas.height = gs * LEVELS;
    actx.clearRect(0, 0, atlas.width, atlas.height);
    actx.font = `400 ${(CELL + 1) * dpr}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
    actx.textAlign = 'center'; actx.textBaseline = 'middle';
    for (let l = 0; l < LEVELS; l++) {
      actx.fillStyle = `hsl(${HUE}, ${SAT}%, ${L_MIN + (L_MAX - L_MIN) * l / (LEVELS - 1)}%)`;
      for (let g = 1; g < GLYPHS.length; g++) actx.fillText(GLYPHS[g], (g + 0.5) * gs, (l + 0.5) * gs + dpr * 0.5);
    }
    atlasKey = CELL + ':' + dpr;
  }
  if (document.fonts) document.fonts.ready.then(() => { atlasKey = ''; });

  const lev = d => Math.max(0, Math.min(LEVELS - 1, Math.round((1 - d) * (LEVELS - 1))));
  const pick = (ramp, v) => GI[ramp[Math.max(0, Math.min(ramp.length - 1, (v * ramp.length) | 0))]];
  const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
  const put = (c, r, g, l, p) => {
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const i = r * cols + c;
    if (p >= gP[i]) { gG[i] = g; gL[i] = l; gP[i] = p; }
  };
  // direction of travel → line glyph
  function dirGlyph(dx, dy) {
    let a = Math.atan2(dy, dx); if (a < 0) a += Math.PI; if (a >= Math.PI) a -= Math.PI;
    const d = a * 180 / Math.PI;
    if (d < 22.5 || d >= 157.5) return GI['-'];
    if (d < 67.5) return GI['\\'];
    if (d < 112.5) return GI['|'];
    return GI['/'];
  }

  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.max(1, W * dpr); cv.height = Math.max(1, H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CELL = W < 600 ? 7 : 9;
    cols = Math.max(1, Math.ceil(W / CELL)); rows = Math.max(1, Math.ceil(H / CELL));
    const n = cols * rows;
    gG = new Uint8Array(n); gL = new Uint8Array(n); gP = new Uint8Array(n);
    trI = new Float32Array(n); trG = new Uint8Array(n); mask = new Uint8Array(n);
    horizonY = H * (W < 600 ? 0.5 : 0.56);
    pole = { x: W * 0.5, y: horizonY * 0.34 };

    // ridges (far: soft hills, near: darker foreground)
    farRow = new Int16Array(cols); nearRow = new Int16Array(cols); skyEnd = new Int16Array(cols);
    for (let c = 0; c < cols; c++) {
      const x = c * CELL;
      const far = horizonY - H * 0.07 * (0.5 + 0.5 * Math.sin(x * 0.0052 + 1.3)) - H * 0.025 * Math.sin(x * 0.016 + 0.4) - H * 0.008 * Math.sin(x * 0.051);
      const near = horizonY + H * 0.025 - H * 0.04 * (0.5 + 0.5 * Math.sin(x * 0.0036 + 2.1)) - H * 0.012 * Math.sin(x * 0.019 + 1.7) - H * 0.004 * Math.sin(x * 0.09);
      farRow[c] = Math.round(far / CELL); nearRow[c] = Math.round(near / CELL);
      skyEnd[c] = Math.min(farRow[c], nearRow[c]);
    }

    // stars around the celestial pole (fixed seed so the sky stays the same night to night)
    const R = rng(7), maxR = Math.hypot(W, H);
    const count = Math.round(W * H / 1500);
    stars = [];
    for (let i = 0; i < count; i++) {
      const r = Math.sqrt(R()) * maxR;
      const b = Math.pow(R(), 3.2);                  // many faint, few bright
      stars.push({ r, a: R() * Math.PI * 2, b, tw: R() * 6.28, pc: -1, pr: -1 });
    }
    // pine trees on the near ridge, away from the timer box
    trees = [];
    const TR = rng(11);
    for (let i = 0; i < Math.round(cols / 18); i++) {
      const c = Math.floor(TR() * cols);
      trees.push({ c, h: 4 + Math.floor(TR() * (W < 600 ? 4 : 7)) });
    }
    // clouds
    const CR = rng(23);
    clouds = [];
    for (let i = 0; i < 5; i++) {
      const parts = [];
      const n2 = 3 + Math.floor(CR() * 3);
      for (let k = 0; k < n2; k++) parts.push({ dx: (k - n2 / 2) * 26 + CR() * 14, dy: CR() * 10 - 5, r: 16 + CR() * 18 });
      clouds.push({ x0: CR() * (W + 400), y: horizonY * (0.15 + CR() * 0.5), v: 18 + CR() * 26, parts });
    }
    atlasKey = '';
  }
  function clearTrails() { if (trI) trI.fill(0); }

  // ASCII frames around [data-ascii] elements
  function frames() {
    mask.fill(0);
    document.querySelectorAll('[data-ascii]').forEach(el => {
      if (el.hidden) return;
      const r = el.getBoundingClientRect();
      if (!r.width) return;
      const c0 = Math.floor(r.left / CELL) - 1, c1 = Math.ceil(r.right / CELL);
      const r0 = Math.floor(r.top / CELL) - 1, r1 = Math.ceil(r.bottom / CELL);
      const framed = el.dataset.ascii === 'frame';
      for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) {
        if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
        const edgeV = cc === c0 || cc === c1, edgeH = rr === r0 || rr === r1;
        if (framed && (edgeV || edgeH)) {
          put(cc, rr, edgeV && edgeH ? GI['+'] : edgeH ? GI['-'] : GI['|'], lev(0.55), 250);
        } else {
          mask[rr * cols + cc] = 1;
          put(cc, rr, 0, 0, 240);
        }
      }
    });
  }

  // meteors
  const meteors = [];

  let lastT = 0, started = false;
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(100, t - (lastT || t)); lastT = t;
    if (innerWidth !== W || innerHeight !== H) layout();
    if (W < 2 || H < 2) return;
    if (atlasKey !== CELL + ':' + dpr) buildAtlas();
    tick(); render();

    const hrs = simHours();
    const { night, twi } = light();
    const theta = -hrs * Math.PI / 12;        // 15° per hour, counter-clockwise around the pole
    const p = progress();
    const exposing = running && night > 0.5;
    const calm = reduced.matches ? 0.4 : 1;

    // HUD
    const day = new Date(); day.setDate(day.getDate() + Math.floor(hrs / 24));
    const hh = Math.floor(hrs % 24), mm = Math.floor((hrs % 1) * 60);
    const speed = Math.round(SKY[mode].span * 60 / S[mode]);
    const hud = `CAM-01  ${day.toISOString().slice(0, 10)}  ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}  x${speed}  ${running ? (exposing ? 'REC * open' : 'REC *') : 'PAUSE ||'}`;
    if (hudEl.textContent !== hud) hudEl.textContent = hud;

    gP.fill(0); gG.fill(0);

    // --- sky texture: night grain, airglow, twilight bands
    const sunX = mode === 'focus' ? (p < 0.5 ? W * 0.12 : W * 0.88) : W * (0.1 + 0.8 * p);
    for (let c = 0; c < cols; c++) {
      const end = skyEnd[c];
      const side = Math.exp(-Math.pow((c * CELL - sunX) / (W * 0.35), 2));
      for (let r = 0; r < end; r++) {
        const h = hash(c, r), up = end - r;
        let d = 0, g = 0;
        const tw = twi * Math.exp(-up / (rows * 0.1)) * (0.45 + 0.55 * side);
        if (h < tw * 0.55) { d = 0.12 + 0.3 * tw; g = GI[tw > 0.5 ? '=' : tw > 0.25 ? '-' : '.']; }
        else if (h < night * (0.025 + 0.09 * Math.exp(-up / 5))) { d = 0.1 + 0.08 * night; g = GI['.']; }
        if (g) put(c, r, g, lev(d), 1);
      }
    }

    // --- stars and trails
    const ft = t * 0.001;
    for (const s of stars) {
      const x = pole.x + Math.cos(s.a + theta) * s.r, y = pole.y + Math.sin(s.a + theta) * s.r;
      const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
      if (exposing && s.b > 0.16 && s.pc >= 0) {
        // rasterize the arc segment since last frame into the trail buffer
        const dc = c - s.pc, dr = r - s.pr, n = Math.max(Math.abs(dc), Math.abs(dr));
        if (n > 0 && n < 40) {
          const g = dirGlyph(-Math.sin(s.a + theta), Math.cos(s.a + theta));
          for (let k = 1; k <= n; k++) {
            const cc = s.pc + Math.round(dc * k / n), rr = s.pr + Math.round(dr * k / n);
            if (cc < 0 || rr < 0 || cc >= cols || rr >= rows || rr >= skyEnd[cc]) continue;
            const i = rr * cols + cc, v = 0.25 + 0.65 * s.b;
            if (v > trI[i]) { trI[i] = v; trG[i] = g; }
          }
        }
      }
      s.pc = c; s.pr = r;
      if (c < 0 || r < 0 || c >= cols || r >= rows || r >= skyEnd[c]) continue;
      const vis = night + twi * 0.25;
      if (vis < (1 - s.b) * 0.9) continue;
      const twk = 0.75 + 0.25 * Math.sin(ft * (2 + s.tw) + s.tw * 10) * calm;
      const v = Math.min(1, s.b * twk * (0.4 + 0.6 * vis));
      put(c, r, GI[s.b > 0.7 ? '*' : s.b > 0.35 ? '+' : s.b > 0.15 ? "'" : '.'], lev(0.25 + 0.7 * v), 6);
    }
    if (night < 0.3) for (let i = 0; i < trI.length; i++) trI[i] *= 0.965;     // day washes the trails out
    for (let i = 0; i < trI.length; i++) {
      const v = trI[i];
      if (v > 0.06) put(i % cols, (i / cols) | 0, trG[i], lev(v * 0.85), 3);
    }

    // --- clouds (move with sky time, mostly by day)
    const cloudVis = 1 - night * 0.8;
    if (cloudVis > 0.1) for (const cl of clouds) {
      const cx = ((cl.x0 + hrs * cl.v) % (W + 400)) - 200;
      for (const pt of cl.parts) {
        const px = cx + pt.dx, py = cl.y + pt.dy, pr = pt.r;
        const c0 = Math.floor((px - pr) / CELL), c1 = Math.ceil((px + pr) / CELL);
        const r0 = Math.floor((py - pr * 0.55) / CELL), r1 = Math.ceil((py + pr * 0.55) / CELL);
        for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
          const dx = (c * CELL + CELL / 2 - px) / pr, dy = (r * CELL + CELL / 2 - py) / (pr * 0.55);
          const q = dx * dx + dy * dy;
          if (q > 1) continue;
          if (c >= 0 && c < cols && r >= skyEnd[c]) continue;
          if (q > 0.72) put(c, r, GI[dy < 0 ? '~' : '-'], lev(0.28 * cloudVis), 7);
          else put(c, r, hash(c, r) < 0.25 ? GI['.'] : 0, lev(0.12 * cloudVis), 7);   // cloud body hides stars
        }
      }
    }

    // --- sun (breaks) and moon (focus)
    if (mode !== 'focus') {
      const sx = W * (0.1 + 0.8 * p), sy = horizonY - Math.sin(Math.PI * p) * H * 0.42;
      const R = CELL * 3.3;
      const sc = Math.floor(sx / CELL), sr = Math.floor(sy / CELL), Rc = Math.ceil(R / CELL) + 4;
      for (let r = sr - Rc; r <= sr + Rc; r++) for (let c = sc - Rc; c <= sc + Rc; c++) {
        if (c < 0 || c >= cols || r >= skyEnd[c]) continue;
        const dx = c * CELL + CELL / 2 - sx, dy = r * CELL + CELL / 2 - sy, d = Math.hypot(dx, dy);
        if (d < R - CELL * 0.6) put(c, r, 0, 0, 8);
        else if (d < R + CELL * 0.5) put(c, r, GI[Math.abs(dx) > Math.abs(dy) * 1.6 ? (dx < 0 ? '(' : ')') : 'O'], lev(0.6), 8);
        else if (d < R + CELL * 2.6) {
          const a = Math.atan2(dy, dx) + t * 0.0002 * calm;
          if (Math.abs(Math.sin(a * 6)) > 0.93) put(c, r, dirGlyph(dx, dy), lev(0.42), 8);
        }
      }
    } else {
      const u = (p - 0.08) / 0.84;
      if (u > 0 && u < 1) {
        const mx = W * (0.88 - 0.76 * u), my = horizonY - Math.sin(Math.PI * u) * H * 0.3;
        const R = CELL * 2.6, k = Math.cos(simDay * 0.9) * 0.85;           // phase changes night to night
        const mc = Math.floor(mx / CELL), mr = Math.floor(my / CELL), Rc = Math.ceil(R / CELL) + 1;
        for (let r = mr - Rc; r <= mr + Rc; r++) for (let c = mc - Rc; c <= mc + Rc; c++) {
          if (c < 0 || c >= cols || r >= skyEnd[c]) continue;
          const dx = (c * CELL + CELL / 2 - mx) / R, dy = (r * CELL + CELL / 2 - my) / R, d = Math.hypot(dx, dy);
          if (d > 1.15) continue;
          if (d > 0.85) { put(c, r, GI['o'], lev(0.5), 8); continue; }
          const lit = dx > k * Math.sqrt(Math.max(0, 1 - dy * dy));
          put(c, r, lit ? 0 : GI[':'], lev(0.3), 8);
        }
      }
    }

    // --- meteors (only while the shutter is open)
    if (exposing && Math.random() < dt / 9000) {
      const a = Math.PI * (0.62 + Math.random() * 0.26) * (Math.random() < 0.5 ? 1 : -1) + (Math.random() < 0.5 ? 0 : Math.PI);
      meteors.push({ x: W * (0.1 + Math.random() * 0.8), y: horizonY * (0.08 + Math.random() * 0.45), a: Math.abs(a) % Math.PI, born: t });
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i], age = (t - m.born) / 650;
      if (age > 1) { meteors.splice(i, 1); continue; }
      const dx = Math.cos(m.a), dy = Math.sin(m.a), head = age * 260, len = 90;
      const g = dirGlyph(dx, dy);
      for (let s = 0; s < len; s += CELL * 0.7) {
        const x = m.x + dx * (head - s), y = m.y + dy * (head - s);
        const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
        if (c < 0 || c >= cols || r < 0 || r >= skyEnd[c]) continue;
        put(c, r, g, lev((1 - s / len) * (1 - age) * 0.9), 9);
      }
    }

    // --- ground: far hills, near ridge, fading toward the foreground
    for (let c = 0; c < cols; c++) {
      for (let r = skyEnd[c]; r < rows; r++) {
        const h = hash(c * 1.3, r * 0.7);
        if (r < nearRow[c]) {                                        // far hills
          const top = r === farRow[c];
          put(c, r, top ? GI['_'] : (h < 0.55 ? GI[':'] : GI['.']), lev(top ? 0.5 : 0.28), 20);
        } else {
          const depth = r - nearRow[c];
          const d = Math.max(0.1, 0.78 - depth / (rows * 0.3));
          if (depth === 0) { put(c, r, GI['#'], lev(0.7), 21); continue; }
          if (h > d + 0.15) { put(c, r, 0, 0, 21); continue; }
          put(c, r, pick(".,:;=+%#&@", d * (0.75 + 0.5 * h)), lev(0.2 + 0.65 * d), 21);
        }
      }
    }
    // pines
    for (const tr of trees) {
      const base = nearRow[tr.c];
      for (let k = 0; k < tr.h; k++) {
        const r = base - tr.h + k, half = Math.floor(k * 0.5);
        if (k === 0) { put(tr.c, r, GI['^'], lev(0.85), 22); continue; }
        if (half > 0) put(tr.c - half, r, GI['/'], lev(0.85), 22);
        for (let x = -half + 1; x < half; x++) put(tr.c + x, r, GI['%'], lev(0.75), 22);
        if (half > 0) put(tr.c + half, r, GI['\\'], lev(0.85), 22);
        else put(tr.c, r, GI['|'], lev(0.85), 22);
      }
      put(tr.c, base, GI['|'], lev(0.9), 22);
    }

    // --- UI frames last so they always win
    frames();

    // draw: one glyph per cell
    ctx.clearRect(0, 0, W, H);
    const gs = CELL * dpr;
    for (let i = 0, n = cols * rows; i < n; i++) {
      if (!gP[i] || !gG[i]) continue;
      ctx.drawImage(atlas, gG[i] * gs, gL[i] * gs, gs, gs, (i % cols) * CELL, ((i / cols) | 0) * CELL, CELL, CELL);
    }
  }

  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
